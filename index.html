<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <meta name="theme-color" content="#000000">
    <title>Diagnostician</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas
        id="unity-canvas"
        width=1920
        height=1080
        tabindex="-1"
        aria-label="Diagnostician"></canvas>

      <div id="unity-loading-bar" role="status" aria-live="polite">
        <div id="unity-loading-title">DIAGNOSTICIAN</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <button
        id="unity-fullscreen-button"
        type="button"
        title="Plein écran"
        aria-label="Passer en plein écran">⛶</button>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");

        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.textContent = msg;
        div.className = type === "error" ? "unity-error" : "unity-warning";
        warningBanner.appendChild(div);

        if (type !== "error") {
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ciprofloxacine",
        productName: "Diagnostician",
        productVersion: "0.1.0",
        showBanner: unityShowBanner
      };

      // Keep Unity's default canvas/render-target synchronization and native
      // device pixel ratio. This avoids stretching a low-resolution buffer.


      document.querySelector("#unity-loading-bar").style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width =
            (100 * progress) + "%";
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";

          document.querySelector("#unity-fullscreen-button").onclick = function () {
            unityInstance.SetFullscreen(1);
          };

          // Some browsers finalize viewport metrics late. Notify Unity once
          // more after the first DOM frame, then focus the game automatically.
          requestAnimationFrame(function () {
            window.dispatchEvent(new Event("resize"));
            canvas.focus({ preventScroll: true });
          });
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
